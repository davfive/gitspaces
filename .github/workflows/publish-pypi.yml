name: "10-publish-pypi-package"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  extract_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: get_version
        run: |
          # Removes the 'v' prefix from the tag for uv versioning
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 1. THE GATE: Run the full multi-platform matrix
  test:
    needs: extract_version
    uses: ./.github/workflows/test-all.yml

  # 2. THE BUILD: Run the builder if tests pass
  build:
    needs: [extract_version, test]
    uses: ./.github/workflows/build-pypi.yml
    with:
      version: ${{ needs.extract_version.outputs.version }}

  # 3. THE RELEASE: Secure OIDC publishing with manual approval
  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Requires an Environment named 'pypi' in GitHub Settings
    environment:
      name: pypi
      url: https://pypi.org/p/gitspaces
    permissions:
      id-token: write  # REQUIRED for Trusted Publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # HANDS-OFF: No tokens/secrets needed with OIDC