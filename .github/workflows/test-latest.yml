name: Test Latest Python

on:
  push:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: uv pip install -e .[dev]
      
      - name: Run static analysis
        run: uv run invoke static
      
      - name: Run security scan (full)
        run: uv run invoke security --full
        continue-on-error: true  # Don't fail on dependency vulnerabilities

  test:
    needs: static
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    name: test-${{ matrix.os }}-pylatest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Install UV (Unix)
        if: runner.os != 'Windows'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install UV (Windows)
        if: runner.os == 'Windows'
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: pwsh
      
      - name: Install dependencies
        run: uv pip install -e .[dev]
      
      - name: Run tests
        run: uv run invoke test
      
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage-3.14.xml
