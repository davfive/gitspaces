name: Test Latest Versions

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Run Gate
        run: uv run --with invoke invoke static security --full

  generate-matrix:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix
        id: set-matrix
        run: |
          MATRIX=$(jq -c '{include: [.platforms | to_entries[] | .key as $os | .value[] | {os: $os, shell: .}]}' .python-versions.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  test:
    needs: [gate, generate-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    name: test-latest-${{ matrix.os }}-${{ matrix.shell }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup WSL
        if: matrix.shell == 'wsl'
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04

      - name: Install uv
        if: matrix.shell != 'wsl'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run tests (Host)
        if: matrix.shell != 'wsl'
        run: uv run --with invoke invoke test-all

      - name: Run tests (WSL)
        if: matrix.shell == 'wsl'
        shell: wsl-bash {0}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.local/bin/env
          rm -rf ~/gitspaces-test
          cp -r . ~/gitspaces-test
          cd ~/gitspaces-test
          uv run --with invoke invoke test-all
          cp .coverage.* $GITHUB_WORKSPACE/

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.shell == 'bash'
        uses: codecov/codecov-action@v4
        with:
          files: .coverage.*