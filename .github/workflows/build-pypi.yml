name: "99-build-pypi-package"

on:
  workflow_call:
    inputs:
      version:
        description: "The version to build (e.g., 1.2.3)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set project version
        # This is the idiomatic uv way to update pyproject.toml
        run: uv version ${{ inputs.version }}

      - name: Build package
        # Generates .tar.gz and .whl in the dist/ folder
        run: |
          uv sync --all-groups
          uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/