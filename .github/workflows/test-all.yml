name: Test All Versions

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate platform/shell matrix from .python-versions.json
        id: set-matrix
        run: |
          # Just generate OS × shell combinations
          MATRIX=$(jq -c '
            {
              include: [
                .platforms | to_entries[] |
                .key as $os |
                .value[] |
                {os: $os, shell: .}
              ]
            }
          ' .python-versions.json)
          
          echo "Generated matrix:"
          echo "$MATRIX" | jq '.'
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  test:
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    name: test-${{ matrix.os }}-${{ matrix.shell }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python (latest for tooling)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Install UV (Unix)
        if: runner.os != 'Windows'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install UV (Windows)
        if: runner.os == 'Windows'
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: pwsh
      
      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      
      - name: Install dependencies
        run: uv pip install -e .[dev]
      
      - name: Run tests for all Python versions (bash)
        if: matrix.shell == 'bash'
        shell: bash
        run: uv run invoke test-all
      
      - name: Run tests for all Python versions (cmd)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: uv run invoke test-all
      
      - name: Run tests for all Python versions (pwsh)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: uv run invoke test-all
      
      - name: Run tests for all Python versions (wsl)
        if: matrix.shell == 'wsl'
        shell: wsl-bash {0}
        run: |
          # Copy to ext4 for performance
          cp -r . ~/gitspaces-test
          cd ~/gitspaces-test
          uv run invoke test-all
          # Copy coverage files back
          cp coverage-*.xml $GITHUB_WORKSPACE/
      
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.shell == 'bash'
        uses: codecov/codecov-action@v4
        with:
          files: coverage-*.xml
