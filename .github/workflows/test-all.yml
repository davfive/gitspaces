name: Test All Versions

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Run Gate
        run: uv run invoke static security --full

  generate-matrix:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix from .python-versions.json
        id: set-matrix
        run: |
          MATRIX=$(jq -c '{include: [.platforms | to_entries[] | .key as $os | .value[] | {os: $os, shell: .}]}' .python-versions.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  test:
    needs: [gate, generate-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    
    name: test-${{ matrix.os }}-${{ matrix.shell }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      # Standard Runners (Linux, macOS, Windows native)
      - name: Run tests (Standard)
        if: matrix.shell != 'wsl'
        shell: ${{ matrix.shell }}
        run: uv run invoke test-all
      
      # WSL Runner (Self-provisioning via uv)
      - name: Run tests (WSL)
        if: matrix.shell == 'wsl'
        # We assume WSL is installed on the runner
        shell: wsl-bash {0}
        run: |
          rm -rf ~/gitspaces-test
          cp -r . ~/gitspaces-test
          cd ~/gitspaces-test
          # uv will download the necessary Python binaries inside WSL
          uv run invoke test-all
          cp .coverage.* $GITHUB_WORKSPACE/
      
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.shell == 'bash'
        uses: codecov/codecov-action@v4
        with:
          files: .coverage.*