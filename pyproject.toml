[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitspaces"
version = "3.0.0-alpha.5"
description = "A git development workspace manager"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "David Rowe", email = "davfive@gmail.com"}
]
keywords = ["git", "workspace", "development", "clone", "manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.5.0",
    
    # Static analysis
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "vulture>=2.11",
    "xenon>=0.9.0",
    
    # Security
    "bandit>=1.7.0",
    "safety>=3.0.0",
    
    # Build
    "build>=0.10.0",
    "twine>=4.0.0",
    
    # Task runner
    "invoke>=2.2.0",
]

[project.scripts]
gitspaces = "gitspaces.cli:main"
gs = "gitspaces.cli:main"

[project.urls]
Homepage = "https://github.com/davfive/gitspaces"
Repository = "https://github.com/davfive/gitspaces"
Documentation = "https://github.com/davfive/gitspaces#readme"
Issues = "https://github.com/davfive/gitspaces/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/gitspaces --cov-report=term-missing --cov-report=html"
markers = [
    "e2e: End-to-end tests (may require more setup and take longer to run)",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.vulture]
paths = ["src/gitspaces"]
min_confidence = 80

[tool.xenon]
max-absolute = "B"
max-modules = "A"
max-average = "A"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
